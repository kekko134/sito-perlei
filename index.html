<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Per Te</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  color: white;
  background-color: #020b1a; 
  background: radial-gradient(circle at top, #0a2fff, #020b1a);
  height: 100vh;
}

#homeBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  font-size: 30px;
  cursor: pointer;
  z-index: 1000;
  display: none;
}

#nav {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 1000;
}

button {
  padding: 12px 20px;
  margin: 5px;
  border: none;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.15);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  font-weight: bold;
}

button:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(1.05);
}

.section {
  position: absolute;
  width: 100vw;
  height: 100vh;
  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.section.active {
  opacity: 1;
  pointer-events: all;
}

#frase {
  width: 80%;
  font-size: 32px;
  text-align: center;
  line-height: 1.4;
  text-shadow: 0 0 20px rgba(255,255,255,0.4);
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform: scale(0.5);
  filter: blur(10px);
  opacity: 0;
}

#frase.show {
  transform: scale(1);
  filter: blur(0);
  opacity: 1;
}

#counter {
  position: absolute;
  top: 100px;
  font-size: 18px;
  letter-spacing: 2px;
  opacity: 0.7;
}

.heart {
  position: absolute;
  top: -20px;
  color: white;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to { transform: translateY(110vh); }
}

input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
  text-align: center;
}
</style>
</head>
<body>

<div id="login" class="section active" style="opacity: 1; pointer-events: all;">
  <h1>Ciao amore</h1>
  <input type="password" id="pw" placeholder="Password magica...">
  <button onclick="login()">Entra nel mio cuore</button>
</div>

<div id="homeBtn" onclick="show('home')">🏠</div>

<div id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('cinema')">Video</button>
  <button onclick="show('dediche')">Dediche</button>
  <button onclick="show('evocazione')">Segreto</button>
  <button onclick="show('amore')">Ciò che amo di te</button>
</div>

<div id="app" style="display:none">
  <div id="home" class="section">
    <div style="display:grid; grid-template-columns:1fr 1fr; width:100%; height:100%;">
        <img src="foto1.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto2.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto3.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto4.jpg" style="width:100%; height:100%; object-fit:cover;">
    </div>
  </div>

  <div id="cinema" class="section">
    <video id="videoCinema" style="width:100%; height:100%; object-fit:contain;" controls>
      <source src="VIDEO1.mp4" type="video/mp4">
    </video>
  </div>

  <div id="dediche" class="section">
    <div id="dedicaText" style="font-size:24px; text-align:center; width:80%;"></div>
    <button onclick="nextDedica()" style="margin-top:30px;">Un altro pensiero...</button>
  </div>

  <div id="evocazione" class="section">
    <div id="secretBox" style="text-align:center;">
      <p style="font-size:20px; margin-bottom:5px;">🔥 RISE</p>
      <p style="font-size:14px; color:rgba(255,255,255,0.7); margin-bottom:20px;">
        Se non sai cosa inserire riguarda la pagina precedente
      </p>
      <input type="password" id="secretpw" placeholder="La parola segreta...">
      <br>
      <button onclick="secret()">Sblocca</button>
    </div>
  </div>

  <div id="amore" class="section">
    <div id="counter"></div>
    <div id="frase"></div>
    <button id="btnDolce" style="position:absolute; bottom:80px;" onclick="nextFrase()"></button>
  </div>
</div>

<script>
const frasi = [
  "i suoi occhi", "il suo sorriso", "la sua dolcezza", "quando fa la gelosa", "le sue labbra", 
  "il suo profumo", "la sua energia positiva", "la sua intelligenza", "la sua voce", "la sua pazienza",
  "la sua sincerità", "i suoi abbracci", "la sua eleganza", "il modo in cui mi guarda", "i suoi gesti affettuosi",
  "il suo lato romantico", "la sua buonanotte", "le sue guance", "la sua simpatia", "la sua forza",
  "la sua voglia di vivere", "la sua risata", "la sua curiosità", "la sua fantasia", "la sua profondità",
  "il modo in cui mi parla", "il suo collo", "la sua fragilità", "la sua emotività", "i suoi capelli",
  "il bambino dentro di me che riesce a fare uscire", "il suo modo di ballare", "il suo sarcasmo", "la sua lealtà", "il suo modo di rispettarmi",
  "i suoi giochi di sguardo", "la sua passione nei baci", "la sua femminilità", "il suo carattere unico", "la sua attenzione nei dettagli",
  "la sua capacità di farmi sentire speciale", "la sua bellezza interiore", "la sua coerenza", "il suo nasino", "quando mi parla del suo passato",
  "le sue coccole", "la sua carica", "il suo modo di proteggermi", "il suo stile", "che sia pazza tanto quanto me",
  "i suoi baci sul collo", "la sua voglia di fare viaggi insieme", "i sui \"dimmi quando arrivi a casa\"", "la sua cicatrice", "ancora i suoi occhi, perchè sono i più belli del 🌍",
  "la sua bellezza", "il suo cuore", "il suo amore che comprende", "i suoi dolci", "la sua capacità di farmi battere il cuore",
  "come ogni posto con lei diventi bellissimo", "come mangia", "quando reposta video sul nostro amore", "fare la doccia insieme", "quando mi scioglie l'anima",
  "quando mi pensa sempre", "quando mi include nei suoi piani", "quando fa l'offesa per gioco", "come mi capisce con un solo sguardo", "quando mi stringe forte a se",
  "quando mi manda video su tik tok", "quando mi aiuta a non fare scelte sbagliate", "come canta", "quando mi racconta la sua giornata", "quando si appoggia sulla mia spalla",
  "i suoi occhi quando diventano lucidi", "il suo modo di parlare", "bere insieme", "mangiare insieme", "quando mi scrive che le manco",
  "il suo modo di rassicurarmi", "quando mi scrive sul quaderno", "quando mi parla dei suoi cibi preferiti", "quando mi parla dei suoi sogni", "come mi sorride anche da arrabbiata",
  "il suo odore nei miei vestiti", "quando mostra la sua intelligenza", "le nostre chiamate", "il destino che ci ha fatto incontrare", "quando immagina un futuro di noi",
  "riesce a tirare fuori la versione migliore di me", "come trasforma i silenzi in qualcosa di pieno", "come riesce a farmi sentire fortunato", "il modo in cui resta nella mia testa anche quando è lontana", "da quando c'è lei, certi giorni sembrano avere più colore",
  "che continua a farmi venire farfalle allo stomaco", "che mi manca anche se siamo stati insieme tutto il giorno", "è così bella che guardarla è la mia distrazione preferita", "è così bella che il tempo sembra rallentare solo per lasciarmela guardare un po' di più",
  "Amo ogni singola cosa di lei così tanto che \"da morire\" non è una fine, è solo il limite più vicino che conosco per spiegare quello che provo."
];

const pulsantiDolci = ["E poi?", "Dimmi ancora...", "C'è altro?", "E ancora...", "Continua...", "Sei bellissima", "Ancora uno..."];
let index = 0;

function login(){
  if(document.getElementById("pw").value==="estasi contemplativa"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("nav").style.display="block";
    document.getElementById("homeBtn").style.display="block";
    show('home');
  }
}

function show(id){
  document.querySelectorAll(".section").forEach(e=> { e.classList.remove("active"); e.style.opacity="0"; });
  const target = document.getElementById(id);
  target.classList.add("active");
  setTimeout(()=>target.style.opacity="1", 50);
  if(id==='amore') { index=0; updateFrase(); }
}

function updateFrase(){
  const el = document.getElementById("frase");
  const btn = document.getElementById("btnDolce");
  el.classList.remove("show");
  
  setTimeout(()=>{
    el.innerText = frasi[index];
    document.getElementById("counter").innerText = (index + 1) + " / 100";
    btn.innerText = pulsantiDolci[Math.floor(Math.random()*pulsantiDolci.length)];
    el.classList.add("show");
  }, 400);
}

function nextFrase(){
  if(index < frasi.length - 1){
    index++;
    updateFrase();
  } else {
    document.getElementById("amore").innerHTML = `
      <h2 style="font-size:40px;">Ti ami adesso?</h2>
      <div style="display:flex; gap:20px;">
        <button onclick="finale()">Sì</button>
        <button onclick="finale()">No</button>
      </div>
    `;
  }
}

function finale(){
  document.getElementById("amore").innerHTML = `
    <p style="font-size:24px; text-align:center;">Rileggi tutto, perché è tutto vero.</p>
    <button onclick="location.reload()">Rileggi</button>
  `;
}

const dediche=[
"Accanto a te tutto sembra più leggero.",
"Mi basta un tuo sguardo per stare bene.",
"Ogni istante con te è un regalo.",
"Ridi sempre, perché la tua gioia è contagiosa.",
"E sei il mio eviterno.",
"E nient’altro conta quando ci sei tu.",
"Trovo nei tuoi occhi la mia pace.",
"Eclissi tutto il resto con la tua luce.",
"Rimani così, rara e preziosa.",
"Non stancarti mai: splendi per sempre.",
"Oltre il tempo, io sarò qui."
];
let d=0;
function nextDedica(){
  document.getElementById("dedicaText").innerText = dediche[d];
  d = (d+1)%dediche.length;
}

function secret(){
  if(document.getElementById("secretpw").value==="amoreaeterno"){
    document.getElementById("secretBox").innerHTML = `
      <div style="font-size:22px; line-height:1.6; max-width:80%; margin: 0 auto;">
        Ho vissuto 17 anni nella logica.<br><br>
        Quando ti guardo tutto cambia.<br>
        Con te non cerco ordine, cerco verità.<br>
        E in quella verità ci sei tu.
      </div>`;
  }
}

function spawnHeart(){
  const h=document.createElement("div");
  h.classList.add("heart");
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(10+Math.random()*20)+"px";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(spawnHeart,300);
</script>
</body>
</html>
