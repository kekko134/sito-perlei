<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Per Te</title>

<style>
body{
  margin:0;
  font-family: Arial;
  overflow:hidden;
  color:white;
  background: radial-gradient(circle at top,#0a2fff,#020b1a);
}

/* HOME ICON */
#homeBtn{
  position:fixed;
  top:15px;
  left:15px;
  font-size:30px;
  cursor:pointer;
  z-index:1000;
  display:none;
}

/* NAV */
#nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  z-index:1000;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  color:white;
  cursor:pointer;
}

/* SEZIONI */
.section{
  position:absolute;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  opacity:0;
  pointer-events:none;
  transition:1s ease;
  background: radial-gradient(circle at top,#0a2fff,#020b1a);
}

.section.active{
  opacity:1;
  pointer-events:all;
}

/* VIDEO */
#cinema video{
  width:100vw;
  height:100vh;
  object-fit:cover;
}

/* DEDICHE */
#dediche{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#dedicaText{
  width:80%;
  font-size:26px;
  line-height:1.6;
}

/* SEGRETO */
#evocazione{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#evocazione .hint{
  font-size:14px;
  opacity:0.8;
  margin-bottom:10px;
}

#evocazione input{
  padding:12px;
  border-radius:10px;
  border:none;
  text-align:center;
  margin-bottom:10px;
}

/* AMORE */
#amore{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#frase{
  width:80%;
  font-size:28px;
  color:#d9ecff;
  opacity:0;
  transform:scale(1.05);
  filter:blur(6px);
  transition:1s ease;
}

#frase.show{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
}

#counter{
  position:absolute;
  top:20px;
}

/* FINALE */
#finale{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:100vh;
}

.netflix-btn{
  font-size:22px;
  padding:12px 25px;
  margin:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.1);
  border:1px solid white;
}

.netflix-btn:hover{
  transform:scale(1.1);
  background:white;
  color:black;
}

/* CUORI */
.heart{
  position:absolute;
  top:-20px;
  color:white;
  font-size:14px;
  animation: fall linear forwards;
}

@keyframes fall{
  to{ transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;">
  <h1>Ciao amore</h1>
  <input type="password" id="pw">
  <button onclick="login()">Entra</button>
</div>

<div id="homeBtn" onclick="show('home')">🏠</div>

<div id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('cinema')">Video</button>
  <button onclick="show('dediche')">Dediche</button>
  <button onclick="show('evocazione')">Segreto</button>
  <button onclick="show('amore')">100 cose</button>
</div>

<div id="app" style="display:none">

<!-- HOME -->
<div id="home" class="section active">
  <img src="foto1.jpg" style="width:50%;height:50%">
  <img src="foto2.jpg" style="width:50%;height:50%">
  <img src="foto3.jpg" style="width:50%;height:50%">
  <img src="foto4.jpg" style="width:50%;height:50%">
</div>

<!-- VIDEO -->
<div id="cinema" class="section">
  <video controls autoplay playsinline>
    <source src="VIDEO1.mp4" type="video/mp4">
  </video>
</div>

<!-- DEDICHE -->
<div id="dediche" class="section">
  <div id="dedicaText"></div>
  <button onclick="nextDedica()">Avanti</button>
</div>

<!-- SEGRETO -->
<div id="evocazione" class="section">
  <div class="hint">Se non sai la password, torna indietro</div>
  <input type="password" id="secretpw">
  <button onclick="secret()">entra</button>
</div>

<!-- AMORE -->
<div id="amore" class="section">

  <div id="counter"></div>
  <div id="frase"></div>

  <button onclick="nextFrase()" style="position:absolute;bottom:40px;">avanti</button>

</div>

</div>

<script>

/* LOGIN */
function login(){
  if(document.getElementById("pw").value==="estasi contemplativa"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("nav").style.display="block";
    document.getElementById("homeBtn").style.display="block";
  }
}

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id==="amore") resetAmore();
  if(id==="dediche") showDedica();
}

/* SEGRETO */
function secret(){
  if(document.getElementById("secretpw").value==="amoreaeterno"){
    document.getElementById("evocazione").innerHTML=`
      <div style="font-size:20px;line-height:1.7;max-width:80%;">
        Ho vissuto 17 anni nella logica.<br><br>
        Quando ti guardo tutto cambia.<br>
        Con te non cerco ordine, cerco verità.<br>
        E in quella verità ci sei tu.
      </div>
    `;
  }
}

/* DEDICHE */
const dediche = [
"Accanto a te tutto sembra più leggero.",
"Mi basta un tuo sguardo per stare bene.",
"Ogni istante con te è un regalo.",
"Ridi sempre, perché la tua gioia è contagiosa.",
"E sei il mio eviterno.",
"E nient’altro conta quando ci sei tu.",
"Trovo nei tuoi occhi la mia pace.",
"Eclissi tutto il resto con la tua luce.",
"Rimani così, rara e preziosa.",
"Non stancarti mai: splendi per sempre.",
"Oltre il tempo, io sarò qui."
];

let d=0;

function showDedica(){
  document.getElementById("dedicaText").innerText = dediche[d];
}

function nextDedica(){
  d=(d+1)%dediche.length;
  showDedica();
}

/* 100 FRASI COMPLETE */
const frasi = [
"I tuoi occhi quando mi cerchi","Il tuo sorriso improvviso","La tua risata che riempie tutto","Il tuo modo di guardarmi",
"Quando fai finta di essere arrabbiata","La tua dolcezza nei dettagli","Il tuo profumo che resta","La tua voce nei messaggi",
"Quando mi scrivi senza motivo","Quando mi pensi davvero","Quando torni da me","Quando mi stringi forte",
"Quando mi guardi e capisci tutto","Quando non serve parlare","Quando resti anche se puoi andare","La tua sincerità",
"La tua fragilità","La tua forza","Quando ridi senza motivo","Quando sei gelosa",
"Quando sorridi","Quando mi cerchi","Quando mi perdi","Quando mi ritrovi",
"Quando mi pensi di notte","Quando mi abbracci","Quando mi ascolti","Quando mi fai ridere",
"Quando mi fai impazzire","Quando sei semplicemente tu",
"Quando non reciti nulla","Quando sei vera","Quando mi fai sentire casa","Quando mi fai sentire scelto",
"Quando mi vuoi vicino","Quando resti sempre","Quando non scappi","Quando mi capisci",
"Quando mi fai perdere la testa","Quando mi fai sorridere","Quando mi pensi sempre","Quando diventi il mio rifugio",
"Quando diventi il mio caos","Quando diventi la mia pace","Quando sei tutto insieme","Quando sei luce",
"Quando sei il mio posto sicuro","Quando sei la mia scelta","Quando mi ami senza dirlo",
"Quando mi scegli ogni giorno","Quando resti anche nei momenti difficili","Quando nonostante tutto sei qui",
"Quando mi fai sentire vivo","Quando mi fai sentire unico","Quando mi guardi come nessuno",
"Quando sei il mio mondo","Quando sei semplicemente te"
];

let index=0;

function showFrase(){
  const el=document.getElementById("frase");
  el.classList.remove("show");

  setTimeout(()=>{
    el.innerText = frasi[index];
    el.classList.add("show");
    document.getElementById("counter").innerText = `${index+1}/100`;
  },300);
}

function nextFrase(){
  index++;
  if(index>=100){
    finale();
    return;
  }
  showFrase();
}

function resetAmore(){
  index=0;
  showFrase();
}

/* FINALE NETFLIX */
function finale(){
  document.getElementById("amore").innerHTML=`
    <div id="finale">
      <div style="font-size:32px;margin-bottom:20px;">Ti ami adesso?</div>

      <button class="netflix-btn" onclick="choice()">Sì</button>
      <button class="netflix-btn" onclick="choice()">No</button>

      <div id="out" style="margin-top:20px;font-size:22px;"></div>
    </div>
  `;
}

function choice(){
  document.getElementById("out").innerHTML="<b>Rileggi lo stesso</b>";
}

/* CUORI */
function spawnHeart(){
  const h=document.createElement("div");
  h.classList.add("heart");
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

setInterval(spawnHeart,250);

</script>

</body>
</html>
