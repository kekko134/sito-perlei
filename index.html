<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Per Te</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  color: white;
  /* Sfondo blu scuro ma leggibile */
  background: #020b1a;
  background: radial-gradient(circle at top, #0a2fff, #020b1a);
  height: 100vh;
}

#homeBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  font-size: 30px;
  cursor: pointer;
  z-index: 1000;
  display: none;
}

#nav {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 1000;
}

button {
  padding: 12px 20px;
  margin: 5px;
  border: none;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.1);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  font-weight: bold;
  border: 1px solid rgba(255,255,255,0.2);
}

button:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: scale(1.05);
}

.section {
  position: absolute;
  width: 100vw;
  height: 100vh;
  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.section.active {
  opacity: 1;
  pointer-events: all;
}

/* Box per garantire la leggibilità */
.glass-box {
  background: rgba(0, 0, 0, 0.6);
  padding: 40px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  text-align: center;
  max-width: 85%;
  backdrop-filter: blur(10px);
}

#frase {
  font-size: 30px;
  line-height: 1.4;
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform: scale(0.6);
  filter: blur(10px);
  opacity: 0;
}

#frase.show {
  transform: scale(1);
  filter: blur(0);
  opacity: 1;
}

#counter {
  font-size: 16px;
  letter-spacing: 2px;
  opacity: 0.7;
  margin-bottom: 20px;
}

.heart {
  position: absolute;
  top: -20px;
  color: white;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to { transform: translateY(110vh); }
}

input {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid white;
  margin-bottom: 15px;
  text-align: center;
  background: rgba(0,0,0,0.5);
  color: white;
}
</style>
</head>
<body>

<div id="login" class="section active" style="opacity: 1; pointer-events: all;">
  <div class="glass-box">
    <h1>Ciao amore</h1>
    <input type="password" id="pw" placeholder="Password magica...">
    <br>
    <button onclick="login()">Entra</button>
  </div>
</div>

<div id="homeBtn" onclick="show('home')">🏠</div>

<div id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('cinema')">Video</button>
  <button onclick="show('dediche')">Dediche</button>
  <button onclick="show('evocazione')">Segreto</button>
  <button onclick="show('amore')">Ciò che amo di te</button>
</div>

<div id="app" style="display:none">
  
  <div id="home" class="section">
    <div style="display:grid; grid-template-columns:1fr 1fr; width:100%; height:100%;">
        <img src="foto1.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto2.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto3.jpg" style="width:100%; height:100%; object-fit:cover;">
        <img src="foto4.jpg" style="width:100%; height:100%; object-fit:cover;">
    </div>
  </div>

  <div id="cinema" class="section">
    <video id="videoCinema" style="width:100%; height:100%; object-fit:contain;" controls>
      <source src="VIDEO1.mp4" type="video/mp4">
    </video>
  </div>

  <div id="dediche" class="section">
    <div class="glass-box">
        <div id="dedicaText" style="font-size:26px;"></div>
        <button onclick="nextDedica()" style="margin-top:30px;">Un altro pensiero...</button>
    </div>
  </div>

  <div id="evocazione" class="section">
    <div class="glass-box" id="secretBox">
      <p style="font-size:20px; margin-bottom:5px;">🔥 RISE</p>
      <p style="font-size:14px; margin-bottom:20px; opacity: 0.8;">
        Se non sai cosa inserire riguarda la pagina precedente
      </p>
      <input type="password" id="secretpw" placeholder="La parola segreta...">
      <br>
      <button onclick="secret()">Sblocca</button>
    </div>
  </div>

  <div id="amore" class="section">
    <div class="glass-box">
        <div id="counter"></div>
        <div id="frase"></div>
        <button id="btnDolce" style="margin-top:20px;" onclick="nextFrase()"></button>
    </div>
  </div>
</div>

<script>
const frasi = [
  "i tuoi occhi", "il tuo sorriso", "la tua dolcezza", "quando fai la gelosa", "le tue labbra", 
  "il tuo profumo", "la tua energia positiva", "la tua intelligenza", "la tua voce", "la tua pazienza",
  "la tua sincerità", "i tuoi abbracci", "la tua eleganza", "il modo in cui mi guardi", "i tuoi gesti affettuosi",
  "il tuo lato romantico", "la tua buonanotte", "le tue guance", "la tua simpatia", "la tua forza",
  "la tua voglia di vivere", "la tua risata", "la tua curiosità", "la tua fantasia", "la tua profondità",
  "il modo in cui mi parli", "il tuo collo", "la tua fragilità", "la tua emotività", "i tuoi capelli",
  "il bambino dentro di me che riesci a fare uscire", "il tuo modo di ballare", "il tuo sarcasmo", "la tua lealtà", "il tuo modo di rispettarmi",
  "i tuoi giochi di sguardo", "la tua passione nei baci", "la tua femminilità", "il tuo carattere unico", "la tua attenzione nei dettagli",
  "la tua capacità di farmi sentire speciale", "la tua bellezza interiore", "la tua coerenza", "il tuo nasino", "quando mi parli del tuo passato",
  "le tue coccole", "la tua carica", "il tuo modo di proteggermi", "il tuo stile", "che sei pazza tanto quanto me",
  "i tuoi baci sul collo", "la tua voglia di fare viaggi insieme", "i tuoi \"dimmi quando arrivi a casa\"", "la tua cicatrice", "ancora i tuoi occhi, perché sono i più belli del 🌍",
  "la tua bellezza", "il tuo cuore", "il tuo amore che comprende", "i tuoi dolci", "la tua capacità di farmi battere il cuore",
  "come ogni posto con te diventi bellissimo", "come mangi", "quando reposti video sul nostro amore", "fare la doccia insieme", "quando mi sciogli l'anima",
  "quando mi pensi sempre", "quando mi includi nei tuoi piani", "quando fai l'offesa per gioco", "come mi capisci con un solo sguardo", "quando mi stringi forte a te",
  "quando mi mandi video su tik tok", "quando mi aiuti a non fare scelte sbagliate", "come canti", "quando mi racconti la tua giornata", "quando ti appoggi sulla mia spalla",
  "i tuoi occhi quando diventano lucidi", "il tuo modo di parlare", "bere insieme", "mangiare insieme", "quando mi scrivi che ti manco",
  "il tuo modo di rassicurarmi", "quando mi scrivi sul quaderno", "quando mi parli dei tuoi cibi preferiti", "quando mi parli dei tuoi sogni", "come mi sorridi anche da arrabbiata",
  "il tuo odore nei miei vestiti", "quando mostri la tua intelligenza", "le nostre chiamate", "il destino che ci ha fatto incontrare", "quando immagini un futuro di noi",
  "riesci a tirare fuori la versione migliore di me", "come trasformi i silenzi in qualcosa di pieno", "come riesci a farmi sentire fortunato", "il modo in cui resti nella mia testa anche quando sei lontana", "da quando ci sei tu, certi giorni sembrano avere più colore",
  "che continui a farmi venire farfalle allo stomaco", "che mi manchi anche se siamo stati insieme tutto il giorno", "sei così bella che guardarti è la mia distrazione preferita", "sei così bella che il tempo sembra rallentare solo per lasciarti guardare un po' di più",
  "Amo ogni singola cosa di te così tanto che \"da morire\" non è una fine, è solo il limite più vicino che conosco per spiegare quello che provo."
];

const pulsantiDolci = ["E poi?", "Dimmi ancora...", "C'è altro?", "Continua...", "Sei bellissima", "Ancora uno..."];
let index = 0;

function login(){
  if(document.getElementById("pw").value==="estasi contemplativa"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("nav").style.display="block";
    document.getElementById("homeBtn").style.display="block";
    show('home');
  }
}

function show(id){
  document.querySelectorAll(".section").forEach(e=> { e.classList.remove("active"); e.style.opacity="0"; });
  const target = document.getElementById(id);
  target.classList.add("active");
  setTimeout(()=>target.style.opacity="1", 50);
  if(id==='amore') { index=0; updateFrase(); }
}

function updateFrase(){
  const el = document.getElementById("frase");
  const btn = document.getElementById("btnDolce");
  el.classList.remove("show");
  
  setTimeout(()=>{
    el.innerText = frasi[index];
    document.getElementById("counter").innerText = (index + 1) + " / 100";
    btn.innerText = pulsantiDolci[Math.floor(Math.random()*pulsantiDolci.length)];
    el.classList.add("show");
  }, 400);
}

function nextFrase(){
  if(index < frasi.length - 1){
    index++;
    updateFrase();
  } else {
    document.getElementById("amore").innerHTML = `
      <div class="glass-box">
        <h2 style="font-size:40px; margin-bottom:30px;">Ti ami adesso?</h2>
        <div style="display:flex; justify-content:center; gap:20px;">
          <button onclick="finale()">Sì</button>
          <button onclick="finale()">No</button>
        </div>
      </div>
    `;
  }
}

function finale(){
  document.getElementById("amore").innerHTML = `
    <div class="glass-box">
      <h2 style="font-size:28px; margin-bottom:20px;">Rileggi tutto, perché è tutto vero.</h2>
      <button onclick="location.reload()">Rileggi</button>
    </div>
  `;
}

const dediche=[
"Accanto a te tutto sembra più leggero.",
"Mi basta un tuo sguardo per stare bene.",
"Ogni istante con te è un regalo.",
"Ridi sempre, perché la tua gioia è contagiosa.",
"E sei il mio eviterno.",
"E nient’altro conta quando ci sei tu.",
"Trovo nei tuoi occhi la mia pace.",
"Eclissi tutto il resto con la tua luce.",
"Rimani così, rara e preziosa.",
"Non stancarti mai: splendi per sempre.",
"Oltre il tempo, io sarò qui."
];
let d=0;
function nextDedica(){
  document.getElementById("dedicaText").innerText = dediche[d];
  d = (d+1)%dediche.length;
}

function secret(){
  if(document.getElementById("secretpw").value==="amoreaeterno"){
    document.getElementById("secretBox").innerHTML = `
      <div style="font-size:22px; line-height:1.6; color:white;">
        Ho vissuto 17 anni cercando di essere razionale,
        seguendo le ie rigide regole matematiche.<br><br>
        Quando ti guardo tutto cambia.<br>
        Con te non cerco ordine, cerco verità.<br>
        E in quella verità ci sei tu.
      </div>`;
  }
}

function spawnHeart(){
  const h=document.createElement("div");
  h.classList.add("heart");
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(10+Math.random()*20)+"px";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(spawnHeart,300);
</script>
</body>
</html>
