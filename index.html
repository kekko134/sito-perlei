<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Per Te</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: radial-gradient(circle at top,#0a2fff,#020b1a);
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

#title{
  font-size:42px;
  color:#7fd3ff;
  text-shadow:0 0 20px #2b6cff;
}

/* NAV */
#nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:none;
}

/* BUTTON */
button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:rgba(43,108,255,0.6);
  color:white;
  cursor:pointer;
}

/* SEZIONI */
.section{
  position:absolute;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  opacity:0;
  pointer-events:none;
  transition:1s ease;
}

.section.active{
  opacity:1;
  pointer-events:all;
}

/* HOME */
#home{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
}

#home img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* VIDEO */
#cinema video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CUORI */
.heart{
  position:absolute;
  top:-20px;
  color:white;
  font-size:14px;
  animation: fall linear forwards;
}

@keyframes fall{
  to{ transform: translateY(110vh); }
}

/* AMORE */
#amore{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#frase{
  width:80%;
  font-size:28px;
  line-height:1.5;
  color:#d9ecff;
}

#counter{
  position:absolute;
  top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="title">Ciao amore, questo è per te</div>
  <input type="password" id="pw">
  <button onclick="login()">Entra</button>
</div>

<!-- NAV -->
<div id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('cinema')">Memorie</button>
  <button onclick="show('evocazione')">Segreto</button>
  <button onclick="show('amore')">Quello che amo di te</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<!-- HOME -->
<div id="home" class="section active">
  <img src="foto1.jpg">
  <img src="foto2.jpg">
  <img src="foto3.jpg">
  <img src="foto4.jpg">
</div>

<!-- VIDEO -->
<div id="cinema" class="section">
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<!-- SEGRETO -->
<div id="evocazione" class="section">
  <input type="password" id="secretpw">
  <button onclick="secret()">entra</button>
</div>

<!-- AMORE -->
<div id="amore" class="section">

  <div id="hearts"></div>

  <div id="counter"></div>
  <div id="frase"></div>

  <button onclick="nextFrase()" style="position:absolute;bottom:40px;">
    continua
  </button>

</div>

</div>

<script>

/* LOGIN */
function login(){
  if(document.getElementById("pw").value==="estasi contemplativa"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("nav").style.display="block";
  }
}

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(e=>{
    e.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");

  if(id==="amore") resetAmore();
}

/* SEGRETO */
function secret(){
  if(document.getElementById("secretpw").value==="amoreaeterno"){
    document.getElementById("evocazione").innerHTML=`
      <div style="font-size:22px;line-height:1.7;padding:30px;color:#d9ecff;">
        Ho passato 17 anni a vivere in modo razionale, secondo i miei numeri e la mia rigida matematica.<br><br>
        Quando ti guardo capisco che tutto cambia.<br>
        Con te non cerco più ordine, cerco verità.<br>
        E in quella verità ci sei sempre tu.
      </div>
    `;
  }
}

/* 🔥 100 FRASI COMPLETE */
const frasi = [
"I tuoi occhi","Il tuo sorriso","La tua dolcezza","Quando fai la gelosa","Le tue labbra",
"Il tuo profumo","La tua energia","La tua intelligenza","La tua voce","La tua pazienza",
"La tua sincerità","I tuoi abbracci","La tua eleganza","Il tuo modo di guardarmi","I tuoi gesti",
"La tua risatina","Quando riesci a toccarmi l’anima","Quando dormiremo insieme","Il tuo cuore",
"Quando mi scrivi ti amo sul quaderno","La tua fragilità","Il tuo carattere","La tua forza",
"La tua dolcezza improvvisa","Il tuo modo di arrabbiarti","Quando fai il muretto","Il tuo sguardo perso",
"Quando ridi senza motivo","Il modo in cui mi pensi","Quando mi cerchi","Quando mi perdi",
"Quando mi ritrovi","La tua sincerità disarmante","Quando mi stringi forte","Il tuo profumo sui miei vestiti",
"Quando mi guardi in silenzio","Il tuo modo di proteggermi","La tua gelosia","La tua libertà",
"Il tuo modo di amare","Il tuo modo di vivere","Quando metti il rossettino","Quando sorridi appena sveglia",
"Quando mi scrivi senza motivo","Quando mi pensi la notte","Quando mi chiami","Quando mi ascolti",
"Quando mi capisci","Quando mi fai ridere","Quando mi fai pensare","Quando mi cambi la giornata",
"Quando mi manchi","Quando mi vuoi","Quando resti","Quando non vai via","Quando torni",
"Quando dormiamo insieme","Quando parli dei tuoi sogni","Quando mi racconti tutto","Quando ti apri",
"Quando ti chiudi e poi torni","Quando mi guardi male per gioco","Quando fai il broncio",
"Quando ridi piano","Quando ti stringi a me","Quando mi cerchi con gli occhi",
"Quando mi fai sentire casa","Quando sei fragile","Quando sei forte","Quando sei te stessa",
"Quando sei mia","Quando sei lontana","Quando sei vicina","Quando sei tutto",
"Quando mi scegli","Quando mi vuoi bene","Quando mi ami","Quando resti con me",
"Quando non scappi","Quando mi parli del gelato","Quando mi stringi forte a te",
"Quando mi guardi e sorridi","Quando sei gelosa","Quando mi fai impazzire","Quando sei perfetta",
"Quando sei imperfetta","Quando sei unica","Quando sei mia ancora",
"Quando mi pensi davvero","Quando mi fai battere il cuore","Quando mi guardi come nessuno",
"Quando mi fai sentire vivo","Quando sei il mio posto sicuro","Quando sei tutto quello che voglio",
"Quando mi scegli ogni giorno","Quando nonostante tutto resti"
];

/* SISTEMA */
let index=0;

function showFrase(){
  document.getElementById("counter").innerText = `${index+1}/100`;
  document.getElementById("frase").innerText = frasi[index];
}

function nextFrase(){
  index++;

  if(index>=frasi.length){
    document.getElementById("frase").innerHTML=`
      <div style="font-size:34px;font-weight:bold;">
        Ti ami adesso?
      </div>`;
    document.getElementById("counter").innerText="";
    return;
  }

  showFrase();
}

function resetAmore(){
  index=0;
  showFrase();
}

/* CUORI */
function spawnHeart(){
  const h=document.createElement("div");
  h.classList.add("heart");
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.getElementById("hearts").appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

setInterval(spawnHeart,300);

</script>

</body>
</html>
