<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Per Te</title>

<style>
body{
  margin:0;
  font-family: Arial;
  overflow:hidden;
  color:white;
  background: radial-gradient(circle at top,#0a2fff,#020b1a);
}

/* HOME ICON */
#homeBtn{
  position:fixed;
  top:15px;
  left:15px;
  font-size:30px;
  cursor:pointer;
  z-index:1000;
  display:none;
}

/* NAV */
#nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  z-index:1000;
}

button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  color:white;
  cursor:pointer;
}

/* SEZIONI */
.section{
  position:absolute;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  opacity:0;
  pointer-events:none;
  transition:1s ease;
  background: radial-gradient(circle at top,#0a2fff,#020b1a);
}

.section.active{
  opacity:1;
  pointer-events:all;
}

/* HOME */
#home{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
}

#home img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* VIDEO FULL SCREEN FIX */
#cinema{
  background:black;
}

#cinema video{
  width:100vw;
  height:100vh;
  object-fit:cover;
}

/* SEGRETO CENTRATO */
#evocazione{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#evocazione input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  text-align:center;
}

/* AMORE */
#amore{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#frase{
  width:80%;
  font-size:28px;
  color:#d9ecff;
}

#counter{
  position:absolute;
  top:20px;
}

/* CUORI GLOBALI */
.heart{
  position:absolute;
  top:-20px;
  color:white;
  font-size:14px;
  animation: fall linear forwards;
  opacity:0.8;
  z-index:500;
}

@keyframes fall{
  to{ transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;">
  <h1 style="color:#7fd3ff;">Ciao amore</h1>
  <input type="password" id="pw">
  <button onclick="login()">Entra</button>
</div>

<!-- HOME ICON -->
<div id="homeBtn" onclick="show('home')">🏠</div>

<!-- NAV -->
<div id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('cinema')">Video</button>
  <button onclick="show('evocazione')">Segreto</button>
  <button onclick="show('amore')">Quello che amo di te</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<!-- HOME -->
<div id="home" class="section active">
  <img src="foto1.jpg">
  <img src="foto2.jpg">
  <img src="foto3.jpg">
  <img src="foto4.jpg">
</div>

<!-- VIDEO -->
<div id="cinema" class="section">
  <video autoplay muted loop playsinline>
    <source src="VIDEO1.mp4" type="video/mp4">
  </video>
</div>

<!-- SEGRETO -->
<div id="evocazione" class="section">
  <input type="password" id="secretpw" placeholder="codice segreto">
  <button onclick="secret()">entra</button>
</div>

<!-- AMORE -->
<div id="amore" class="section">

  <div id="hearts"></div>
  <div id="counter"></div>
  <div id="frase"></div>

  <button onclick="nextFrase()" style="position:absolute;bottom:40px;">
    continua
  </button>

</div>

</div>

<script>

/* LOGIN */
function login(){
  if(document.getElementById("pw").value==="estasi contemplativa"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("nav").style.display="block";
    document.getElementById("homeBtn").style.display="block";
  }
}

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(e=>{
    e.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");

  if(id==="amore") resetAmore();
}

/* SEGRETO */
function secret(){
  if(document.getElementById("secretpw").value==="amoreaeterno"){
    document.getElementById("evocazione").innerHTML=`
      <div style="font-size:20px;line-height:1.7;color:#d9ecff;max-width:80%;">
        Ho passato 17 anni a vivere in modo razionale, secondo i miei numeri e la mia matematica.<br><br>
        Quando ti guardo capisco che tutto cambia.<br>
        Con te non cerco più ordine, cerco verità.<br>
        E in quella verità ci sei sempre tu.
      </div>
    `;
  }
}

/* 💙 100 FRASI REALI */
const frasi = [
"I tuoi occhi","Il tuo sorriso","La tua dolcezza","La tua risata","Il tuo profumo",
"La tua voce","Il tuo modo di guardarmi","I tuoi abbracci","La tua energia","La tua intelligenza",
"La tua pazienza","La tua sincerità","Il tuo carattere","La tua forza","La tua fragilità",
"I tuoi capelli","Le tue labbra","Il tuo naso","Il tuo collo","Le tue mani",
"Quando fai la gelosa","Quando sorridi appena sveglia","Quando mi cerchi","Quando mi perdi",
"Quando mi ritrovi","Quando mi stringi forte","Quando mi pensi","Quando mi scrivi",
"Quando mi chiami","Quando ridi senza motivo","Quando sei nervosa","Quando sei dolce all’improvviso",
"Quando fai il muretto","Quando mi guardi in silenzio","Quando mi ascolti","Quando mi capisci",
"Quando mi fai ridere","Quando mi fai stare bene","Quando mi fai impazzire","Quando mi manchi",
"Quando torni","Quando resti","Quando non scappi","Quando sei sincera","Quando sei vera",
"Quando sei mia","Quando sei tutto","Quando sei niente senza di me","Quando sei casa",
"Quando sei caos","Quando sei pace","Quando sei luce","Quando sei buio e poi luce",
"Quando mi abbracci da dietro","Quando mi stringi la mano","Quando mi baci piano","Quando mi guardi forte",
"Quando mi ascolti davvero","Quando mi fai sentire importante","Quando mi fai sentire scelto",
"Quando mi fai sentire vivo","Quando mi fai perdere la testa","Quando mi fai sorridere da solo",
"Quando mi pensi la notte","Quando mi sogni","Quando mi vuoi vicino","Quando mi vuoi lontano ma mi cerchi",
"Quando mi dici il tuo segreto","Quando mi racconti tutto","Quando ti fidi di me","Quando non ti fidi e poi sì",
"Quando ti arrabbi per poco","Quando ti passa subito","Quando mi perdoni","Quando mi capisci senza parole",
"Quando mi guardi come nessuno","Quando mi scegli ogni giorno","Quando resti anche quando è difficile",
"Quando nonostante tutto sei qui","Quando mi ami davvero","Quando mi fai capire che sei unica",
"Quando mi fai sentire tuo","Quando mi fai sentire tuo mondo","Quando mi fai sentire casa",
"Quando mi fai sentire completo","Quando sei semplicemente tu"
];

/* SISTEMA */
let index=0;

function showFrase(){
  document.getElementById("counter").innerText = `${index+1}/100`;
  document.getElementById("frase").innerText = frasi[index];
}

function nextFrase(){
  index++;
  if(index>=frasi.length){
    document.getElementById("frase").innerHTML="<b>Ti ami adesso?</b>";
    document.getElementById("counter").innerText="";
    return;
  }
  showFrase();
}

function resetAmore(){
  index=0;
  showFrase();
}

/* CUORI GLOBALI */
function spawnHeart(){
  const h=document.createElement("div");
  h.classList.add("heart");
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

setInterval(spawnHeart,250);

</script>

</body>
</html>
